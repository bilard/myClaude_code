server {
    listen 80;
    server_name ibs-studio.com www.ibs-studio.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ibs-studio.com www.ibs-studio.com;

    # SSL - Adapter les chemins selon votre configuration
    # (Let's Encrypt, Certbot, ou autre)
    ssl_certificate /etc/letsencrypt/live/ibs-studio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ibs-studio.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Taille max upload (100MB)
    client_max_body_size 100M;

    # Proxy vers le serveur Node.js
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
    }

    # Cache des assets statiques
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
